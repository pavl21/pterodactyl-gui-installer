# .github/workflows/verify-signature.yml
# Prüft, ob SHA256SUMS alle Skripte vollständig und korrekt enthält und die Signatur
# (SHA256SUMS.sig) zum Public Key GD_SIGNING_PUBKEY in installer.sh passt. Ohne das würde
# GermanDactyl Setup nach einem Merge auf main jedes nachgeladene Skript ablehnen.
# Nach jeder Änderung an einem Skript lokal ausführen: scripts/sign-release.sh --sign
name: Signatur prüfen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prüfsummen und Signatur prüfen
        run: bash scripts/sign-release.sh --check
